name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6d4aa8&color_dots=#ebedf0,#d6c7f0,#b39ddb,#7e57c2,#4c1d95
            dist/github-snake-dark.svg?color_snake=#a78bfa&color_dots=#161b22,#2d2545,#4c1d95,#7c5cd6,#c4b5fd

      - name: Push to output branch
        run: |
          sudo chown -R $(id -u):$(id -g) dist
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update snake animation"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
