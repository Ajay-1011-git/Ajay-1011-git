<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="img" aria-label="divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3.5" width="1000" height="1" fill="#A78BFA" fill-opacity="0.16"/>
  <rect x="-200" y="3" width="200" height="2" rx="1" fill="url(#pulse)">
    <animate attributeName="x" values="-200;1000" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
